<!doctype html>
<html lang="sv" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1b1a" />
    <!-- Dark by default; light, if chosen, before the first paint (src/lib/theme.ts). #f2f2f4 = the light --color-canvas. -->
    <script>
      try {
        if (localStorage.getItem('vagen-theme') === 'light') {
          delete document.documentElement.dataset.theme
          document.querySelector('meta[name="theme-color"]').content = '#f2f2f4'
        }
      } catch {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent: on iOS 26 Home Screen apps that makes the web view one status-bar height too
         short, leaving a strip under the tab bar (WebKit bug 301108). Read at install time: reinstall to apply. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Veyin" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Veyin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
